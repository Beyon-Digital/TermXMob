[project]
name = "termx"
version = "0.1.2"
description = "Host interactive terminal sessions and connect from your phone or browser."
readme = "README.md"
authors = [
    { name = "Jainam", email = "49641518+Psyborgs-git@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "qrcode>=8.2",
    "uvicorn[standard]>=0.52.4",
    "websockets>=17.1",
    "pywinpty>=2.0.15; sys_platform == 'win32'",
    "pillow>=11.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
webrtc = [
    "aiortc>=1.14",
    "av>=15",
    "numpy>=2.3",
]

[project.scripts]
termx = "termx:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
packaging = [
    "pyinstaller>=6.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
