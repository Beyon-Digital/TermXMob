<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Termx</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0b0d10; color: #e8eaed;
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  main { text-align: center; max-width: 420px; padding: 32px; }
  .mark {
    width: 72px; height: 72px; margin: 0 auto 22px;
    display: flex; align-items: center; justify-content: center;
  }
  .mark svg { width: 100%; height: 100%; }
  h1 { font-size: 17px; font-weight: 600; margin: 0 0 6px; }
  #status { color: #9aa0a6; font-size: 13px; min-height: 20px; }
  .spinner {
    width: 18px; height: 18px; margin: 18px auto 0; border-radius: 50%;
    border: 2px solid #262a31; border-top-color: #2d6cdf; animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hint { margin-top: 26px; font-size: 12px; color: #6b7075; }
</style>
</head>
<body>
<main>
  <svg class="mark" viewBox="0 0 512 512" aria-hidden="true">
    <defs>
      <linearGradient id="boot-cyan" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#00D9FF"/>
        <stop offset="100%" stop-color="#38F2B2"/>
      </linearGradient>
    </defs>
    <rect x="244" y="96" width="24" height="74" rx="12" fill="#162431"/>
    <circle cx="256" cy="78" r="46" fill="#162431"/>
    <circle cx="256" cy="78" r="27" fill="url(#boot-cyan)"/>
    <rect x="48" y="238" width="76" height="104" rx="38" fill="#162431"/>
    <rect x="388" y="238" width="76" height="104" rx="38" fill="#162431"/>
    <rect x="90" y="150" width="332" height="244" rx="92" fill="#162431"/>
    <rect x="112" y="172" width="288" height="200" rx="72" fill="#F7F8FA"/>
    <rect x="138" y="204" width="236" height="136" rx="36" fill="#0E1822"/>
    <path d="M187 242 L233 272 L187 302" stroke="url(#boot-cyan)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="258" y="287" width="72" height="18" rx="9" fill="url(#boot-cyan)"/>
  </svg>
  <h1>Termx</h1>
  <div id="status">Starting the local service…</div>
  <div class="spinner"></div>
  <p class="hint">If this takes too long, use the Termx menu → Restart Backend.</p>
</main>
</body>
</html>
