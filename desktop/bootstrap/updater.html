<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src ipc: http://ipc.localhost">
  <title>Termx — Software Update</title>
  <link rel="stylesheet" href="updater.css">
  <script src="updater.js" defer></script>
</head>
<body>
  <main>
    <header><span class="mark" aria-hidden="true">&gt;_</span><span>TERMX DESKTOP</span></header>
    <p class="eyebrow">SOFTWARE UPDATE</p>
    <h1 id="title">Checking for updates…</h1>
    <p id="description">Connecting to the Termx release service.</p>
    <section class="versions" aria-label="Version information">
      <div><span>Installed version</span><strong id="current">—</strong></div>
      <div id="available-row" hidden><span>Available version</span><strong id="available"></strong></div>
    </section>
    <div id="status" role="status" aria-live="polite" aria-atomic="true"></div>
    <div id="progress-region" hidden>
      <progress id="progress" aria-label="Update progress"></progress>
      <p id="bytes"></p>
    </div>
    <div id="error" role="alert" hidden></div>
    <details id="release-notes" hidden><summary>What’s new</summary><pre id="notes"></pre></details>
    <footer>
      <button id="action" type="button" disabled>Checking…</button>
      <p id="hint">You can close this window and continue working.</p>
    </footer>
  </main>
</body>
</html>
