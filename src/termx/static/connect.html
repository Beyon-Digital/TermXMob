<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Termx — Machine Status</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: flex-start; justify-content: center;
    background: #0b0d10; color: #e8eaed;
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 32px 0;
  }
  main { width: min(420px, 92vw); padding: 28px; }
  h1 { margin: 0 0 2px; font-size: 20px; letter-spacing: -0.01em; }
  p.hint { margin: 0 0 20px; color: #9aa0a6; font-size: 13px; }
  .machine { display: flex; align-items: center; gap: 8px; margin: 2px 0 18px; }
  .machine-name { font-size: 14px; font-weight: 600; }
  .machine-detail { color: #9aa0a6; font-size: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #7fd18b; flex: none; }
  .dot.warn { background: #f0b254; }
  .section { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #9aa0a6; margin: 18px 0 6px; }
  .perm { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; background: #171a1f; border: 1px solid #262a31; border-radius: 8px; margin-bottom: 6px; }
  .perm .name { font-size: 13px; }
  .perm .state { font-size: 12px; font-weight: 600; }
  .perm .state.ok { color: #7fd18b; }
  .perm .state.bad { color: #f0883e; }
  .perm .state.other { color: #9aa0a6; }
  .qr {
    display: flex; align-items: center; justify-content: center;
    background: #fff; border-radius: 12px; padding: 14px; aspect-ratio: 1; max-width: 260px; margin: 0 auto 20px;
  }
  .qr svg, .qr img { width: 100%; height: 100%; }
  .mark { display: block; width: 68px; height: 68px; margin: 0 auto 14px; }
  .row { margin-bottom: 12px; }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #9aa0a6; margin-bottom: 4px; }
  code { display: block; background: #171a1f; border: 1px solid #262a31; border-radius: 8px; padding: 10px 12px; font-size: 13px; overflow-wrap: anywhere; }
  button {
    width: 100%; margin-top: 6px; padding: 10px 12px; border-radius: 8px; border: 1px solid #2d6cdf;
    background: #2d6cdf; color: #fff; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  button.secondary { background: transparent; color: #c6c9ce; border-color: #33383f; }
  .status { min-height: 18px; margin-top: 8px; font-size: 12px; color: #7fd18b; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <svg class="mark" viewBox="0 0 512 512" aria-hidden="true">
    <defs>
      <linearGradient id="connect-cyan" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#00D9FF"/>
        <stop offset="100%" stop-color="#38F2B2"/>
      </linearGradient>
    </defs>
    <rect x="244" y="96" width="24" height="74" rx="12" fill="#162431"/>
    <circle cx="256" cy="78" r="46" fill="#162431"/>
    <circle cx="256" cy="78" r="27" fill="url(#connect-cyan)"/>
    <rect x="48" y="238" width="76" height="104" rx="38" fill="#162431"/>
    <rect x="388" y="238" width="76" height="104" rx="38" fill="#162431"/>
    <rect x="90" y="150" width="332" height="244" rx="92" fill="#162431"/>
    <rect x="112" y="172" width="288" height="200" rx="72" fill="#F7F8FA"/>
    <rect x="138" y="204" width="236" height="136" rx="36" fill="#0E1822"/>
    <path d="M187 242 L233 272 L187 302" stroke="url(#connect-cyan)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="258" y="287" width="72" height="18" rx="9" fill="url(#connect-cyan)"/>
  </svg>
  <h1>Termx</h1>
  <div class="machine">
    <span class="dot" id="ready-dot"></span>
    <div>
      <div class="machine-name" id="machine-name">Machine status</div>
      <div class="machine-detail" id="machine-detail">Checking…</div>
    </div>
  </div>
  <div class="section" id="perm-section" hidden>Permissions</div>
  <div id="perms"></div>
  <div class="section">Pairing</div>
  <p class="hint">Scan the QR code from your phone, or open the address in a browser.</p>
  <div class="qr" id="qr"></div>
  <div class="row">
    <div class="label">Connection address</div>
    <code id="address">loading…</code>
  </div>
  <div class="row" id="passcode-row" hidden>
    <div class="label">Passcode</div>
    <code id="passcode"></code>
  </div>
  <button id="copy">Copy connection link</button>
  <button class="secondary" id="copy-raw">Copy address only</button>
  <div class="status" id="status"></div>
</main>
<script>
  const params = new URLSearchParams(location.search);
  const key = params.get("k") || "";
  const suffix = key ? "?k=" + encodeURIComponent(key) : "";
  const status = document.getElementById("status");
  let connectUrl = "";

  function flash(text) {
    status.textContent = text;
    setTimeout(() => { status.textContent = ""; }, 2500);
  }

  async function copy(value) {
    try {
      await navigator.clipboard.writeText(value);
      flash("Copied");
    } catch {
      const area = document.createElement("textarea");
      area.value = value;
      document.body.appendChild(area);
      area.select();
      document.execCommand("copy");
      area.remove();
      flash("Copied");
    }
  }

  async function getJson(path) {
    const res = await fetch(path + suffix);
    if (!res.ok) throw new Error("HTTP " + res.status);
    return res.json();
  }

  document.getElementById("copy").addEventListener("click", () => connectUrl && copy(connectUrl));
  document.getElementById("copy-raw").addEventListener("click", () => connectUrl && copy(connectUrl.split("?")[0]));

  function renderPerms(perms) {
    const box = document.getElementById("perms");
    const section = document.getElementById("perm-section");
    const names = {
      screen_recording: "Screen Recording",
      accessibility: "Accessibility",
      screen_capture: "Screen capture",
      input: "Input",
    };
    const entries = Object.entries(perms || {});
    if (!entries.length) return;
    section.hidden = false;
    box.innerHTML = "";
    for (const [key, value] of entries) {
      const ok = value === "granted";
      const other = !ok && value !== "denied";
      const row = document.createElement("div");
      row.className = "perm";
      row.innerHTML =
        '<span class="name"></span><span class="state ' +
        (ok ? "ok" : other ? "other" : "bad") +
        '"></span>';
      row.querySelector(".name").textContent = names[key] || key;
      row.querySelector(".state").textContent = ok ? "Granted" : value === "denied" ? "Not granted" : String(value);
      box.appendChild(row);
    }
  }

  getJson("/api/machine")
    .then((machine) => {
      document.getElementById("machine-name").textContent = machine.hostname || "This machine";
      document.getElementById("machine-detail").textContent =
        [machine.os, machine.arch].filter(Boolean).join(" · ") || "Ready";
      renderPerms(machine.permissions || {});
    })
    .catch(() => {
      document.getElementById("machine-name").textContent = "Termx machine";
      document.getElementById("machine-detail").textContent = "Ready";
    });

  getJson("/api/permissions").then(renderPerms).catch(() => {});

  const qr = document.getElementById("qr");
  const img = document.createElement("img");
  img.alt = "Connection QR code";
  img.src = "/api/connect/qr.svg" + suffix;
  qr.appendChild(img);

  getJson("/api/connect")
    .then((data) => {
      connectUrl = data.connect_url || "";
      const urls = (data.urls || []).filter((u) => !u.includes("127.0.0.1"));
      document.getElementById("address").textContent = urls[0] || data.connect_url || "unknown";
      if (data.passcode) {
        document.getElementById("passcode").textContent = data.passcode;
        document.getElementById("passcode-row").hidden = false;
      }
    })
    .catch(() => {
      document.getElementById("address").textContent = "Could not load connection info";
    });
</script>
</body>
</html>
