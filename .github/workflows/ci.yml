name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Test
        run: uv run pytest -q

  app-types:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install and typecheck
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsc --noEmit

  linux-desktop:
    name: linux desktop capture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install desktop tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            x11-utils \
            x11-xserver-utils \
            x11-apps \
            imagemagick \
            ffmpeg \
            scrot \
            xdotool
      - name: Capture and virtual display tests (Xvfb)
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" \
            env TERMX_LINUX_DESKTOP_TESTS=1 \
            uv run pytest tests/test_capture_linux.py tests/test_displays.py -q
