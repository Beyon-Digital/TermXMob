name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    strategy:
      fail-fast: false
      # PRs run backend tests on one OS; pushes to main get the full OS matrix.
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Test
        run: uv run pytest -q

  linux-desktop:
    name: linux desktop capture
    # PRs only run the python test matrix; desktop capture runs on main/dispatch.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install desktop tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            x11-utils \
            x11-xserver-utils \
            x11-apps \
            imagemagick \
            ffmpeg \
            scrot \
            xdotool
      - name: Capture and virtual display tests (Xvfb)
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" \
            env TERMX_LINUX_DESKTOP_TESTS=1 \
            uv run pytest tests/test_capture_linux.py tests/test_displays.py -q
