name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - name: Verify dedicated workspace
        working-directory: desktop/workspace
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-browser-workspace
          path: desktop/workspace/dist

  python:
    strategy:
      fail-fast: false
      # PRs cover Linux + macOS (platform-specific backend paths); pushes to
      # main get the full OS matrix including Windows.
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest", "macos-latest"]') || fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Test
        run: uv run --locked --extra development --extra media pytest -q

  linux-desktop:
    name: linux desktop capture
    # PRs only run the python test matrix; desktop capture runs on main/dispatch.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install desktop tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            x11-utils \
            x11-xserver-utils \
            x11-apps \
            imagemagick \
            ffmpeg \
            scrot \
            xdotool \
            wmctrl \
            openbox
      - name: Capture and virtual display tests (Xvfb)
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" bash -c '
            openbox >/tmp/termx-ci-window-manager.log 2>&1 &
            window_manager=$!
            trap "kill $window_manager 2>/dev/null || true" EXIT
            TERMX_LINUX_DESKTOP_TESTS=1 TERMX_TEST_NATIVE_WINDOW=1 uv run --locked --extra media pytest tests/test_capture_linux.py tests/test_displays.py tests/test_owned_x11_window.py -q
          '
