name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      os:
        description: 'JSON list of runners for the python job, e.g. ["windows-latest"] (default: all three)'
        default: ''
      pytest_args:
        description: 'When set, run only `pytest <args>` on those runners (diagnosis); the other jobs are skipped'
        default: ''

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    if: inputs.pytest_args == ''
    # Playwright 1.58 cannot install its browser dependencies on ubuntu-26.04
    # (what ubuntu-latest now resolves to), so pin a supported release.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - name: Verify dedicated workspace
        working-directory: desktop/workspace
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Verify rendered workspace and desktop updater
        env:
          TERMX_CONFIG_DIR: ${{ runner.temp }}/termx-ui-tests
        run: |
          uv sync --locked --extra development --extra media
          uv run --no-sync playwright install --with-deps chromium
          uv run --no-sync python tests/workspace_accessibility_e2e.py desktop/build/accessibility desktop/workspace/node_modules/axe-core/axe.min.js
          uv run --no-sync python tests/workspace_settings_tls_e2e.py desktop/build/settings-tls
          uv run --no-sync python tests/workspace_chat_recovery_e2e.py desktop/build/chat-recovery
          uv run --no-sync python tests/updater_ui_e2e.py desktop/build/updater-ui desktop/workspace/node_modules/axe-core/axe.min.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-ui-evidence
          path: |
            desktop/build/accessibility
            desktop/build/updater-ui
            desktop/build/settings-tls
            desktop/build/chat-recovery
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-browser-workspace
          path: desktop/workspace/dist

  python:
    strategy:
      fail-fast: false
      # PRs run Linux only (macOS runners are the expensive ones and macOS is
      # tested locally before pushing); pushes to main get the full OS matrix.
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || (inputs.os != '' && fromJSON(inputs.os)) || fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Linux ELF qualification tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf
      # The suite is serial-heavy on Windows (one run took 66 min). Everything except the two real-QuickJS runtime
      # files is independent per test (own tmp config dir), so it runs on all cores; those two start real worker
      # runtimes with timing budgets that fail under CPU contention, so they run alone afterwards.
      # --durations prints the slowest tests so regressions in run time are visible in every job.
      - name: Test (diagnosis)
        if: inputs.pytest_args != ''
        shell: bash
        run: uv run --locked --extra development --extra media pytest -p no:cacheprovider ${{ inputs.pytest_args }}
      - name: Test (parallel)
        if: inputs.pytest_args == ''
        run: >
          uv run --locked --extra development --extra media pytest -q -n auto --durations=20
          --ignore=tests/test_workflow_integration.py --ignore=tests/test_workflow_runtime.py
      - name: Test (real workflow runtime, serial)
        if: inputs.pytest_args == ''
        run: uv run --locked --extra development --extra media pytest -q --durations=10 tests/test_workflow_integration.py tests/test_workflow_runtime.py

  linux-desktop:
    name: linux desktop capture
    # PRs only run the python test matrix; desktop capture runs on main/dispatch.
    if: github.event_name != 'pull_request' && inputs.pytest_args == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install desktop tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            x11-utils \
            x11-xserver-utils \
            x11-apps \
            imagemagick \
            ffmpeg \
            scrot \
            xdotool \
            wmctrl \
            openbox
      - name: Capture and virtual display tests (Xvfb)
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" bash -c '
            openbox >/tmp/termx-ci-window-manager.log 2>&1 &
            window_manager=$!
            trap "kill $window_manager 2>/dev/null || true" EXIT
            TERMX_LINUX_DESKTOP_TESTS=1 TERMX_TEST_NATIVE_WINDOW=1 uv run --locked --extra media pytest tests/test_capture_linux.py tests/test_displays.py tests/test_owned_x11_window.py -q
          '
