name: Native microphone platform compile

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/src-tauri/Cargo.*'
      - 'desktop/src-tauri/build.rs'
      - 'desktop/src-tauri/macos/media_permission.m'
      - 'desktop/src-tauri/src/media_permission.rs'
      - 'desktop/src-tauri/src/main.rs'
      - 'desktop/src-tauri/src/ui.rs'
      - 'desktop/src-tauri/src/updater.rs'
      - 'desktop/src-tauri/capabilities/**'
      - 'desktop/bootstrap/**'
      - 'desktop/src-tauri/src/workspace.rs'
      - 'desktop/src-tauri/src/companions.rs'
      - 'desktop/src-tauri/src/companion_motion.rs'
      - 'desktop/src-tauri/native/**'
      - 'desktop/src-tauri/Info.plist'
      - 'desktop/src-tauri/entitlements.plist'
      - 'desktop/src-tauri/tauri*.json'
      - 'tests/test_native_media_permission.py'
      - '.github/workflows/native-permission-check.yml'

permissions:
  contents: read

concurrency:
  group: native-permission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-compile:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Install native Linux headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libssl-dev
      - name: Compile actual platform native media policy
        env:
          # This job checks sources only. Frozen runtime staging and packaged
          # assets are hard-gated by desktop.yml, never replaced by dummy files.
          TAURI_CONFIG: '{"bundle":{"resources":null}}'
        run: |
          cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml updater::tests
          cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml companions::
      - uses: astral-sh/setup-uv@v5
      - name: Verify bundle prerequisites and compiled macOS policy
        run: uv run --locked pytest -q tests/test_native_media_permission.py
